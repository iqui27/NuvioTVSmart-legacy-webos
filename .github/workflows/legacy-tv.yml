# CI da variante legacy-tv.
#
# Os tres gates existem porque cada um corresponde a um defeito que ja chegou ao
# aparelho nesta base, e nenhum deles aparece em qualquer etapa do build:
#
#   check:no-undef      -> identificador nunca declarado. Derrubou a home inteira
#                          (o Router rebaixa falha de mount a console.warn, logo
#                          a tela ficava vazia sem erro visivel) e lancava dentro
#                          do handler de erro do hls.js.
#   check:legacy-regex  -> recurso de regex pos-ES2017. O esbuild reescreve um
#                          literal com flag nao suportada como
#                          `new RegExp(src, flags)`, que compila em qualquer
#                          engine e so estoura em runtime.
#   check:legacy-css    -> RELATORIO, nao gate: sai 0 de proposito. Serve para o
#                          numero de features sem fallback aparecer no log e a
#                          variacao ser notada entre releases.
name: legacy-tv

on:
  push:
    branches: [legacy-tv]
    tags: ["v*"]
  pull_request:
    branches: [legacy-tv]

jobs:
  build:
    runs-on: ubuntu-latest
    # O token do Actions e read-only por padrao, e sem contents:write o passo de
    # release responde 403 "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # local.properties nao esta versionado. As 19 chaves do exemplo bastam para
      # buildar e rodar os gates; um IPK publicavel precisa das reais, injetadas
      # por secret.
      - name: Preparar local.properties
        id: props
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -n "$LOCAL_PROPERTIES" ]; then
            printf '%s' "$LOCAL_PROPERTIES" > local.properties
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "usando local.properties do secret"
          else
            cp local.example.properties local.properties
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "usando local.example.properties (build de verificacao, NAO publicavel)"
          fi

      # Primeiro de todos: se a fonte tem marcador de conflito, tudo depois disso
      # esta medindo lixo.
      - name: Gate — integridade da fonte
        run: npm run check:source

      - name: Gate — identificador nunca declarado
        run: npm run check:no-undef

      - name: Lint da home (gate do repo)
        run: npm run lint
        continue-on-error: true

      - name: Build
        env:
          NUVIO_UI_SCALE: "0.8"
          # Em build de tag o rotulo e a propria tag, porque ele aparece em
          # Ajustes no aparelho e "legacy.ci" nao diz a ninguem qual versao esta
          # instalada. Fora de tag continua marcando que veio do CI.
          NUVIO_BUILD_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'legacy.ci' }}
        run: node scripts/build.mjs

      - name: Gate — regex incompativel com Chromium 53
        run: npm run check:legacy-regex

      - name: Fixtures do inline de custom properties
        run: npm run test:css-vars

      # Na branch legacy-tv (webOS 4) este gate se declara inaplicavel e sai 0,
      # porque la custom properties funcionam. So morde na variante 38.
      - name: Gate — custom properties no dist (variante Chromium 38)
        run: npm run check:legacy-css-vars

      - name: Relatorio — cobertura de fallback CSS
        run: npm run check:legacy-css

      # So empacota com as chaves reais. Sem o secret o build sai de
      # local.example.properties e nao funciona no aparelho — anexar isso a uma
      # release entregaria um IPK placeholder a quem for instalar.
      - name: Empacotar IPK
        if: startsWith(github.ref, 'refs/tags/') && steps.props.outputs.real == 'true'
        env:
          NUVIO_IPK_NAME: NuvioTV-webOS-${{ github.ref_name }}.ipk
        run: node scripts/package-webos.mjs

      # Sai como RASCUNHO de proposito. A release fica montada e o IPK anexado
      # sozinho, mas nada vira publico antes de alguem instalar no aparelho e
      # conferir: nesta base, um build que passou em todos os gates ainda subiu
      # com a home vazia, e outro nao buildava a partir de clone limpo. Publicar
      # e um clique depois da verificacao.
      - name: Montar release rascunho com o IPK
        if: startsWith(github.ref, 'refs/tags/') && steps.props.outputs.real == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: NuvioTV-webOS-${{ github.ref_name }}.ipk
          # A GPL-3.0 §6 exige o Corresponding Source junto do binario. A tag no
          # proprio repo publico satisfaz isso, e o corpo da release aponta para ela.
          body: |
            Build nao oficial da variante legacy-tv, para LG webOS 3.x/4.x
            (Chromium 53), plataformas que o upstream deixou de suportar em
            0.3.42.

            Fonte correspondente: esta tag neste repositorio.
            Projeto original: https://github.com/NuvioMedia/NuvioTVSmart
            "Nuvio" e marca dos autores originais e nao e licenciada pela GPL.
